<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Профпроба: кем ты будешь в IT?</title>
<style>:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#18212f; --muted:#5d6878; --line:#dde2ea;
  --pri:#3b4cca; --pri-soft:#e8ebfb;
  --sup:#0e8f7c; --sup-soft:#e0f4f0;   /* сопровождение */
  --dev:#7a4fd8; --dev-soft:#efe8fc;   /* разработка */
  --ok:#1d8a4b; --ok-soft:#e3f4ea; --err:#c2362b; --err-soft:#fbe7e5; --warn:#b77900; --warn-soft:#fdf2d9;
  --r:14px; --shadow:0 6px 24px rgba(24,33,47,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.hidden{display:none!important}
#app{min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:16px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line)}
header.top .logo{width:40px;height:40px;object-fit:contain}
header.top h1{font-size:18px;margin:0}
header.top .who{margin-left:auto;color:var(--muted);font-size:15px}
main{flex:1;padding:24px;max-width:1240px;width:100%;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:24px}
.btn{border:0;border-radius:10px;padding:11px 20px;background:var(--pri);color:#fff;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.light{background:#eef0f5;color:var(--ink)}
.btn.big{padding:15px 30px;font-size:18px}
.btn.ok{background:var(--ok)}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}
.badge.sup{background:var(--sup-soft);color:var(--sup)}
.badge.dev{background:var(--dev-soft);color:var(--dev)}
/* --- старт --- */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:stretch}
@media (max-width:980px){.hero{grid-template-columns:1fr}}
.hero h2{font-size:34px;line-height:1.15;margin:6px 0 12px}
.hero .lead{font-size:18px;color:var(--muted)}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.track{border-radius:12px;padding:16px}
.track.sup{background:var(--sup-soft)} .track.dev{background:var(--dev-soft)}
.track b{display:block;margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:14px}
.field input{border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:17px;outline:none}
.field input:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.field .err{color:var(--err);font-size:13px;min-height:18px}
.org-link{margin-top:18px;font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline}
/* --- прогресс --- */
.progress{display:flex;gap:6px;margin-bottom:16px}
.progress div{flex:1;height:8px;border-radius:99px;background:#dfe3ec}
.progress div.done.sup{background:var(--sup)} .progress div.done.dev{background:var(--dev)}
.progress div.cur{background:var(--pri)}
/* --- задание --- */
.task-head{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.task-head h2{margin:0;font-size:24px}
.task-head .timer{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.task-intro{color:var(--muted);margin:0 0 16px}
.task-goal{background:var(--pri-soft);border-radius:10px;padding:12px 16px;margin-bottom:16px}
.task-body{min-height:380px}
.task-foot{display:flex;gap:10px;align-items:center;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.task-foot .spacer{flex:1}
.msg{border-radius:10px;padding:10px 14px;margin-top:12px;font-weight:500}
.msg.err{background:var(--err-soft);color:var(--err)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.hint{background:var(--warn-soft);color:#6d4b00}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
/* --- итог задания --- */
.overlay{position:fixed;inset:0;background:rgba(18,25,38,.45);display:grid;place-items:center;z-index:50}
.modal{background:#fff;border-radius:18px;padding:28px 32px;width:min(520px,92vw);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:6px 0 8px;font-size:24px}
.score-big{font-size:46px;font-weight:800;color:var(--pri)}
.rate{display:flex;gap:10px;justify-content:center;margin:16px 0 6px}
.rate button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;min-width:120px}
.rate button.sel{border-color:var(--pri);background:var(--pri-soft)}
/* --- сеть --- */
.net-wrap{display:grid;grid-template-columns:1fr 300px;gap:16px}
@media (max-width:1000px){.net-wrap{grid-template-columns:1fr}}
svg.net{width:100%;height:auto;background:#fbfcfe;border:1px solid var(--line);border-radius:12px}
.port{cursor:pointer}
.port:hover rect{stroke-width:3}
.cables{display:flex;flex-direction:column;gap:8px}
.cable-btn{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;text-align:left}
.cable-btn.sel{border-color:var(--pri);background:var(--pri-soft)}
.cable-btn i{width:28px;height:8px;border-radius:4px;display:inline-block}
.ipbox{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.ipbox input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-family:Consolas,monospace}
/* --- терминал --- */
.term{background:#0f1720;color:#d9e2ec;border-radius:12px;font:15px/1.5 Consolas,"Cascadia Mono",monospace;padding:14px 16px;height:360px;overflow:auto}
.term .in{color:#8ee0a0}
.term .err{color:#ff8a80}
.term .okl{color:#7fd7ff}
.term-line{display:flex;gap:8px;align-items:center;background:#0f1720;border-radius:0 0 12px 12px;padding:0 16px 12px;margin-top:-6px}
.term-line span{color:#8ee0a0;font-family:Consolas,monospace}
.term-line input{flex:1;background:transparent;border:0;color:#fff;font:15px Consolas,monospace;outline:none;padding:6px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-family:Consolas,monospace;font-size:14px}
/* --- сборка ПК --- */
.pc-wrap{display:grid;grid-template-columns:280px 1fr;gap:16px}
@media (max-width:1000px){.pc-wrap{grid-template-columns:1fr}}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;text-align:left}
.part.sel{border-color:var(--pri);background:var(--pri-soft)}
.part.used{opacity:.35;pointer-events:none}
.part svg{flex:0 0 46px}
svg.board{width:100%;height:auto;border-radius:12px}
.zone{cursor:pointer}
.post{background:#000;color:#b8f5b8;font:15px/1.6 Consolas,monospace;border-radius:12px;padding:16px;min-height:150px;margin-top:12px}
/* --- робот --- */
.robot-wrap{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
@media (max-width:1000px){.robot-wrap{grid-template-columns:1fr}}
.cmds{display:flex;gap:8px;flex-wrap:wrap}
.cmd{border:0;border-radius:10px;padding:10px 14px;background:var(--dev-soft);color:var(--dev);font-weight:700}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:58px;border:2px dashed var(--line);border-radius:12px;padding:10px;margin:12px 0}
.prog span{background:var(--dev);color:#fff;border-radius:8px;padding:5px 10px;font-weight:600;font-size:14px}
.prog span.act{outline:3px solid #ffb703}
/* --- код --- */
.code{background:#1e1f29;color:#e6e6e6;border-radius:12px;padding:12px 0;font:16px/1.7 Consolas,"Cascadia Mono",monospace;overflow:auto}
.code .ln{display:flex;padding:0 16px;cursor:pointer}
.code .ln:hover{background:#2c2e3b}
.code .ln.bad{background:#5a2420}
.code .ln.good{background:#1f4a2c}
.code .num{width:28px;color:#6b7089;user-select:none}
.code .kw{color:#ff79c6}.code .str{color:#f1fa8c}.code .fn{color:#8be9fd}.code .nm{color:#bd93f9}
.out{background:#0f1720;color:#c8f7c5;border-radius:10px;padding:10px 14px;font-family:Consolas,monospace;margin-top:10px;min-height:44px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;text-align:left;font-family:Consolas,monospace}
.opt:hover{border-color:var(--pri)}
/* --- конструктор --- */
.ui-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
@media (max-width:1000px){.ui-wrap{grid-template-columns:1fr}}
.slot{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;align-items:center;margin-bottom:10px}
.slot .n{width:30px;height:30px;border-radius:50%;background:var(--dev-soft);color:var(--dev);display:grid;place-items:center;font-weight:700}
.slot select,.slot input{border:1.5px solid var(--line);border-radius:8px;padding:8px}
.win{border:1px solid #9aa3b2;border-radius:10px;overflow:hidden;box-shadow:var(--shadow);background:#f3f4f6}
.win .tb{background:#fff;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px;display:flex}
.win .tb span{margin-left:auto;letter-spacing:8px;color:#888}
.win .body{padding:18px;display:flex;flex-direction:column;gap:10px;min-height:250px}
.win .body .lbl{font-size:20px;font-weight:700;text-align:center}
.win .body input{border:1px solid #9aa3b2;border-radius:6px;padding:9px;background:#fff}
.win .body button{border:1px solid #2c6fd4;background:#e9f0fc;border-radius:6px;padding:9px}
.win .body .ph{border:1.5px dashed #b9c0cc;border-radius:6px;padding:9px;color:#9aa3b2;text-align:center}
.sticky{background:#fff7b8;border-radius:4px;padding:10px 14px;transform:rotate(-2deg);box-shadow:0 4px 10px rgba(0,0,0,.12);display:inline-block;margin-top:12px;font-family:"Comic Sans MS","Segoe Print",cursive}
/* --- служба поддержки --- */
.ticket{border:1px solid var(--line);border-radius:12px;padding:18px;background:#fff}
.ticket .from{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ava{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.answers{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.answer{border:2px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;text-align:left}
.answer:hover{border-color:var(--sup)}
.answer.wrong{border-color:var(--err);background:var(--err-soft)}
.answer.right{border-color:var(--ok);background:var(--ok-soft)}
/* --- данные --- */
table.data{border-collapse:collapse;width:100%;font-size:15px}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left}
table.data th{background:#f1f3f8;font-weight:600}
table.data tr.hit td{background:#fff3c4}
.cond{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.cond select{border:1.5px solid var(--line);border-radius:8px;padding:7px 8px}
.sql{background:#1e1f29;color:#e6e6e6;font-family:Consolas,monospace;border-radius:10px;padding:10px 14px;margin:10px 0}
.sql b{color:#ff79c6;font-weight:400}
/* --- итог --- */
.result-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.verdict{font-size:30px;font-weight:800;margin:4px 0}
.bars{margin:18px 0}
.bar{margin-bottom:14px}
.bar .lab{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}
.bar .tr{height:22px;border-radius:99px;background:#e6e9f0;overflow:hidden}
.bar .fill{height:100%;border-radius:99px;transition:width 1s}
.traits{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.trait{background:#f5f7fb;border-radius:12px;padding:12px;text-align:center}
.trait b{display:block;font-size:24px}
.prof{border-radius:14px;padding:18px}
.prof.sup{background:var(--sup-soft)} .prof.dev{background:var(--dev-soft)}
.prof h4{margin:0 0 8px;font-size:18px}
.prof ul{margin:6px 0 0;padding-left:20px}
table.tasks{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.tasks td,table.tasks th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
/* --- сертификат (печать) --- */
.cert{display:none}
@page{size:A4 landscape;margin:10mm}
@media print{
  body{background:#fff}
  #app{display:none!important}
  .overlay{display:none!important}
  .cert{display:block!important;font-family:Georgia,"Times New Roman",serif;color:#1a1f2b}
  .cert .frame{border:3px solid #1f3a7a;padding:7px;height:186mm;box-sizing:border-box}
  .cert .inner{border:1px solid #1f3a7a;height:100%;box-sizing:border-box;padding:14mm 20mm 10mm;text-align:center;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .cert .inner > *:not(.bg){position:relative;z-index:1}
  .cert .bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .cert .logo{height:26mm;align-self:center;margin:-6mm 0 3mm}
  .cert .org{font-size:13px;line-height:1.35;color:#333}
  .cert .org b{font-size:16px;color:#1f3a7a}
  .cert .ttl{font-size:50px;letter-spacing:10px;font-weight:700;color:#1f3a7a;margin-top:5mm}
  .cert .sub{font-size:22px;font-style:italic;margin-top:1mm}
  .cert .vyd{font-size:16px;margin-top:7mm;color:#555}
  .cert .nm{font-size:32px;font-weight:700;margin:2mm 0 4mm;border-bottom:1px solid #b8c2d8;padding-bottom:2mm;align-self:center;min-width:60%}
  .cert .pr{font-size:17px;line-height:1.5}
  .cert .res{font-size:16px;margin-top:4mm}
  .cert .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:15px;text-align:left}
  .cert .place{display:inline-block;font-size:16px;line-height:1.5}
  .cert .sign{display:flex;gap:3mm;align-items:flex-end;margin-left:auto;font-size:16px;line-height:1.5}
  .cert .sign .line{width:32mm;border-bottom:1px solid #333;height:18px}
}
/* --- панель организатора --- */
table.org{width:100%;border-collapse:collapse;font-size:14px}
table.org th,table.org td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
</style></head>

/* Профпроба «Информационные системы»: ядро */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TRACK = { sup: 'Сопровождение ИС', dev: 'Разработка ИС' };
const TASKS = [];            // задания добавляются в файлах tasks-*.js
const ORG_PIN = '0907';
const STORE = 'profproba_results_v1';

const S = { user: null, idx: 0, results: [], t0: 0, timer: null, cur: null };

function store(list) {
  try { if (list) localStorage.setItem(STORE, JSON.stringify(list)); return JSON.parse(localStorage.getItem(STORE) || '[]'); }
  catch (e) { return list || []; }
}

/* ---------- экраны ---------- */
function screen(node) { const m = $('main'); m.innerHTML = ''; m.append(node); window.scrollTo(0, 0); }
function setWho() { $('.who').textContent = S.user ? `${S.user.last} ${S.user.first}` : ''; }

function startScreen() {
  S.user = null; S.idx = 0; S.results = []; setWho();
  const nameOk = v => /^[А-ЯЁа-яёA-Za-z][А-ЯЁа-яёA-Za-z\- ']{0,39}$/.test(v.trim());
  const f = (id, label, req, ph) => h('div', { class: 'field' },
    h('label', { for: id }, label + (req ? ' *' : '')),
    h('input', { id, placeholder: ph, autocomplete: 'off', maxlength: 40 }),
    h('div', { class: 'err', id: id + '_e' }));
  const form = h('div', { class: 'card' },
    h('h3', { style: 'margin-top:0' }, 'Вход участника'),
    f('ln', 'Фамилия', true, 'Иванов'), f('fn', 'Имя', true, 'Иван'), f('pn', 'Отчество', false, 'Иванович'),
    h('div', { class: 'field' }, h('label', { for: 'cls' }, 'Школа и класс'), h('input', { id: 'cls', placeholder: 'Школа № 5, 9 «Б»', maxlength: 60 })),
    h('button', { class: 'btn big', style: 'width:100%', id: 'go', onclick: login }, 'Начать профпробу'),
    h('button', { class: 'org-link', onclick: orgLogin }, 'Для организаторов'));
  function login() {
    let ok = true;
    for (const [id, req] of [['ln', 1], ['fn', 1], ['pn', 0]]) {
      const v = $('#' + id).value; const e = $('#' + id + '_e'); e.textContent = '';
      if (req && !v.trim()) { e.textContent = 'Заполните поле'; ok = false; }
      else if (v.trim() && !nameOk(v)) { e.textContent = 'Только буквы, без цифр'; ok = false; }
    }
    if (!ok) { form.classList.add('shake'); setTimeout(() => form.classList.remove('shake'), 400); return; }
    const cap = s => s.trim().replace(/\s+/g, ' ').replace(/(^|[\s-])([а-яёa-z])/g, (m, a, b) => a + b.toUpperCase());
    S.user = { last: cap($('#ln').value), first: cap($('#fn').value), patr: cap($('#pn').value), cls: $('#cls').value.trim(), start: new Date().toISOString() };
    setWho(); introScreen();
  }
  const hero = h('div', { class: 'hero' },
    h('div', { class: 'card' },
      h('span', { class: 'badge', style: 'background:var(--pri-soft);color:var(--pri)' }, 'День открытых дверей · 20 минут'),
      h('h2', {}, 'Профпроба: кем ты будешь в IT?'),
      h('p', { class: 'lead' }, 'Восемь коротких практических заданий по 2–3 минуты. Ты подключишь компьютеры к сети, починишь сервер, соберёшь компьютер, запрограммируешь робота, найдёшь ошибку в программе и создашь окно приложения.'),
      h('p', { class: 'lead' }, 'По скорости, точности и тому, что тебе понравилось, программа подскажет, какое направление тебе ближе.'),
      h('div', { class: 'tracks' },
        h('div', { class: 'track sup' }, h('b', { style: 'color:var(--sup)' }, 'Техник по сопровождению ИС'), 'Сети, серверы, компьютеры, помощь пользователям, безопасность.'),
        h('div', { class: 'track dev' }, h('b', { style: 'color:var(--dev)' }, 'Разработчик ИС'), 'Алгоритмы, программы, интерфейсы, базы данных.'))),
    form);
  screen(hero);
  setTimeout(() => $('#ln').focus(), 50);
  $$('input', form).forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') login(); }));
}

function introScreen() {
  screen(h('div', { class: 'card', style: 'max-width:760px;margin:0 auto' },
    h('h2', { style: 'margin-top:0' }, `Привет, ${S.user.first}!`),
    h('p', {}, 'Как всё устроено:'),
    h('ul', {},
      h('li', {}, 'Заданий восемь: половина — из работы техника по сопровождению, половина — из работы разработчика. Они чередуются.'),
      h('li', {}, 'В каждом задании есть цель и кнопка «Подсказка». Подсказки можно брать, но без них — больше баллов.'),
      h('li', {}, 'Ошибаться не страшно: можно пробовать снова. Учитываются скорость, ошибки и подсказки.'),
      h('li', {}, 'После задания отметь, понравилось ли оно. Это тоже влияет на результат: профессия должна нравиться!'),
      h('li', {}, 'Застрял совсем — нажми «Пропустить».')),
    h('div', { class: 'row', style: 'margin-top:18px' }, h('button', { class: 'btn big', onclick: () => runTask(0) }, 'Поехали!'))));
}

/* ---------- выполнение задания ---------- */
function runTask(i) {
  S.idx = i; const T = TASKS[i];
  const st = { errors: 0, hints: 0, hintIdx: 0, finished: false };
  S.cur = st; S.t0 = Date.now();
  const prog = h('div', { class: 'progress' }, TASKS.map((t, k) => h('div', { class: k < i ? 'done ' + t.track : k === i ? 'cur' : '' })));
  const timer = h('span', { class: 'timer' }, '0:00');
  const msg = h('div');
  const body = h('div', { class: 'task-body' });
  const hintBtn = h('button', { class: 'btn light', onclick: giveHint }, 'Подсказка');
  const card = h('div', { class: 'card' },
    prog,
    h('div', { class: 'task-head' }, h('span', { class: 'badge ' + T.track }, TRACK[T.track]), h('h2', {}, `${i + 1}. ${T.title}`), timer),

    body, msg,
    h('div', { class: 'task-foot' }, hintBtn, h('span', { class: 'spacer' }), h('button', { class: 'btn ghost', onclick: () => { if (confirm('Пропустить задание? Баллы за него не начислятся.')) finish(0, true); } }, 'Пропустить')));
  screen(card);
  clearInterval(S.timer);
  S.timer = setInterval(() => { const s = Math.floor((Date.now() - S.t0) / 1000); timer.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }, 500);
  function show(kind, text) { msg.innerHTML = ''; if (text) msg.append(h('div', { class: 'msg ' + kind, html: text })); }
  function giveHint() {
    if (st.hintIdx >= T.hints.length) { show('hint', 'Подсказки закончились. Попробуй ещё раз — ты справишься!'); return; }
    st.hints++; show('hint', '💡 ' + T.hints[st.hintIdx++]);
    if (st.hintIdx >= T.hints.length) hintBtn.disabled = true;
  }
  function finish(correct, skipped) {
    if (st.finished) return; st.finished = true; clearInterval(S.timer);
    const sec = Math.round((Date.now() - S.t0) / 1000);
    const score = calcScore(T, correct, st, sec, skipped);
    const res = { id: T.id, track: T.track, title: T.title, correct, errors: st.errors, hints: st.hints, sec, skipped: !!skipped, score, rating: null };
    S.results[i] = res;
    doneModal(res);
  }
  const api = {
    error(text) { st.errors++; show('err', '✖ ' + text); card.classList.add('shake'); setTimeout(() => card.classList.remove('shake'), 400); },
    soft(text) { show('err', text); },
    ok(text) { show('ok', '✔ ' + text); },
    info(text) { show('hint', text); },
    clear() { show(); },
    done(correct = 1, text) { if (text) show('ok', '✔ ' + text); setTimeout(() => finish(correct), text ? 1300 : 300); },
    get finished() { return st.finished; },
  };
  T.render(body, api);
}

function calcScore(T, correct, st, sec, skipped) {
  if (skipped) return 0;
  let s = 100 * correct - 8 * st.errors - 12 * st.hints;
  const r = sec / T.target;
  if (r <= 0.6) s += 10; else if (r <= 1) s += 5; else if (r > 2.5) s -= 15; else if (r > 1.6) s -= 8;
  return Math.max(correct > 0 ? 20 : 0, Math.min(100, Math.round(s)));
}

/* ---------- итог ---------- */
function analyse(results) {
  const tr = k => results.filter(r => r && r.track === k);
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
  const out = {};
  for (const k of ['sup', 'dev']) {
    const rs = tr(k);
    const perf = avg(rs.map(r => r.score));
    const interest = avg(rs.map(r => r.rating == null ? 50 : (r.rating - 1) * 50));
    out[k] = { perf: Math.round(perf), interest: Math.round(interest), total: Math.round(0.75 * perf + 0.25 * interest) };
  }
  const all = results.filter(Boolean);
  const done = all.filter(r => !r.skipped);
  out.speed = Math.round(100 * avg(done.map(r => Math.min(1, TASKS.find(t => t.id === r.id).target / Math.max(r.sec, 1)))));
  out.accuracy = Math.round(100 * avg(done.map(r => 1 / (1 + r.errors))));
  out.independence = Math.round(100 * avg(all.map(r => r.skipped ? 0 : 1 / (1 + r.hints))));
  const d = out.dev.total - out.sup.total;
  out.lead = Math.abs(d) < 8 ? 'both' : d > 0 ? 'dev' : 'sup';
  return out;
}

/* Подложка сертификата: схемы, микросхемы, двоичный код, фрагменты кода */
function certBg() {
  const C = '#1f3a7a';
  let s = '';
  const pad = (x, y) => `<circle cx="${x}" cy="${y}" r="4" fill="none" stroke="${C}" stroke-width="2"/><circle cx="${x}" cy="${y}" r="1.5" fill="${C}"/>`;
  const trace = (pts) => `<path d="M${pts.map(p => p.join(' ')).join(' L')}" fill="none" stroke="${C}" stroke-width="2" stroke-linejoin="round"/>` + pad(...pts[pts.length - 1]);
  const chip = (x, y, w, hh, label) => {
    let g = `<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="4" fill="none" stroke="${C}" stroke-width="2.5"/>`;
    for (let i = 1; i <= 5; i++) {
      const px = x + i * w / 6, py = y + i * hh / 6;
      g += `<path d="M${px} ${y} v-9 M${px} ${y + hh} v9 M${x} ${py} h-9 M${x + w} ${py} h9" stroke="${C}" stroke-width="2"/>`;
    }
    return g + `<circle cx="${x + 9}" cy="${y + 9}" r="3" fill="${C}"/><text x="${x + w / 2}" y="${y + hh / 2 + 5}" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="${C}">${label}</text>`;
  };
  // левый верхний угол: микросхема и дорожки
  let g1 = chip(48, 52, 70, 70, 'CPU');
  g1 += trace([[118, 72], [170, 72], [190, 52], [260, 52]]) + trace([[118, 92], [200, 92], [220, 112], [300, 112]]) + trace([[118, 112], [150, 112], [150, 170], [170, 190]]);
  g1 += trace([[68, 122], [68, 190], [88, 210], [88, 260]]) + trace([[88, 122], [88, 160], [118, 190], [200, 190]]) + trace([[98, 52], [98, 20]]);
  s += `<g opacity=".16">${g1}</g>`;
  // правый нижний угол — то же, повёрнутое на 180°
  // правый край: микросхема «база данных» над подписью, дорожки уходят вверх и к краю
  let g2 = chip(885, 455, 60, 60, 'DB');
  g2 += trace([[905, 455], [905, 400], [925, 380], [925, 330]]) + trace([[925, 455], [925, 420], [960, 385], [960, 300]]);
  g2 += trace([[945, 475], [975, 475]]) + trace([[885, 495], [850, 495], [835, 480], [835, 430]]);
  s += `<g opacity=".16">${g2}</g>`;
  // правый верхний угол: двоичный код, затухающий к центру
  let bin = ''; let seed = 7;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  for (let r = 0; r < 8; r++) {
    let row = ''; for (let k = 0; k < 12; k++) row += (rnd() > .5 ? '1' : '0') + (k % 4 === 3 ? ' ' : '');
    bin += `<text x="975" y="${48 + r * 22}" text-anchor="end" font-family="Consolas,monospace" font-size="15" fill="${C}" opacity="${(0.22 - r * 0.022).toFixed(3)}" letter-spacing="2">${row}</text>`;
  }
  s += bin;
  // левый нижний угол (над городом и датой): фрагмент кода
  const code = ['def check(login, pwd):', '  user = find(login)', '  if user.ok(pwd):', '    return True', 'SELECT * FROM students', ' WHERE grade = 9;'];
  s += code.map((t, i) => `<text x="30" y="${455 + i * 19}" font-family="Consolas,monospace" font-size="13" fill="${C}" opacity=".13" xml:space="preserve">${esc(t)}</text>`).join('');
  return `<svg class="bg" viewBox="0 0 1000 700" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}

      else api.done(1, 'Отлично! Ты составил два SQL-запроса.');
    }

    drawConds(); refresh();

      h('div', {}, h('b', {}, 'Таблица «Ученики»'), tbl)));
  },
});
